name: Build debug APK

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  WAVELENGTH_VERSION: v0.2.0
  AAR_PATH: app/libs/Wavewalletdk.aar
  APK_PATH: app/build/outputs/apk/debug/app-debug.apk

jobs:
  build:
    name: Assemble arm64-v8a debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.1.0'

      - name: Cache Wavelength SDK AAR
        id: aar-cache
        uses: actions/cache@v4
        with:
          path: ${{ env.AAR_PATH }}
          key: wavewalletdk-aar-${{ env.WAVELENGTH_VERSION }}

      - name: Download Wavelength SDK AAR
        if: steps.aar-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          mkdir -p "$(dirname "$AAR_PATH")"
          curl -fL --retry 5 --retry-all-errors --retry-delay 5 \
            -o "$AAR_PATH" \
            "https://github.com/lightninglabs/wavelength/releases/download/${WAVELENGTH_VERSION}/Wavewalletdk.aar"
          ls -lh "$AAR_PATH"

      - name: Inspect SDK native libraries
        run: |
          set -euo pipefail
          unzip -l "$AAR_PATH" | grep -E 'lib/[^/]+/[^/]+\.so' || true

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Assemble debug APK
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleDebug --stacktrace --no-daemon

      - name: Verify APK ABIs
        run: |
          set -euo pipefail
          ls -lh "$APK_PATH"
          unzip -l "$APK_PATH" | grep -E 'lib/' || true
          if ! unzip -l "$APK_PATH" | grep -q 'lib/arm64-v8a/'; then
            echo "::error::APK does not contain arm64-v8a native libraries"
            exit 1
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: wavelength-android-debug
          path: ${{ env.APK_PATH }}
          if-no-files-found: error
          retention-days: 30
